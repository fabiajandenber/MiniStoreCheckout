<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Store Checkout System</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 800px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 7px;
        }

        input,
        select,
        button {
            width: 100%;
            padding: 11px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            margin-top: 15px;
            background: #222;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background: #444;
        }

        .product {
            border: 1px solid #ddd;
            padding: 15px;
            margin-top: 15px;
            border-radius: 8px;
            background: #fafafa;
        }

        .product h3 {
            margin-top: 0;
        }

        #validationMessage {
            color: red;
            margin: 15px 0;
            font-weight: bold;
        }

        #orderSummary {
            margin-top: 25px;
            padding: 20px;
            border-radius: 8px;
            background: #f5f5f5;
            line-height: 1.7;
        }

        .summary-title {
            font-weight: bold;
            font-size: 20px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>MINI STORE CHECKOUT SYSTEM</h1>

    <div class="form-group">
        <label for="customerName">Customer Name</label>
        <input type="text" id="customerName" placeholder="Enter customer name">
    </div>

    <div class="form-group">
        <label for="productCount">Number of Products</label>
        <input type="number" id="productCount" min="1" placeholder="Enter number of products">
    </div>

    <div id="productsContainer"></div>

    <div class="form-group">
        <label for="deliveryOption">Delivery Option</label>
        <select id="deliveryOption">
            <option value="1">Store Pickup</option>
            <option value="2">Standard Delivery</option>
            <option value="3">Express Delivery</option>
        </select>
    </div>

    <div id="validationMessage"></div>

    <button id="calculateBtn">Calculate Order</button>

    <div id="orderSummary"></div>

</div>

<script src="script.js"></script>

</body>
</html>
